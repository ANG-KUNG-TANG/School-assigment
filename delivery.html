<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delivery</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #FAF7F0;
      margin: 0;
      color: #2E4E34;
    }
    header, footer {
      background-color: #6B4226;
      color: #FAF7F0;
      text-align: center;
      padding: 1rem;
    }
    .container {
      max-width: 600px;
      margin: 2rem auto;
      padding: 1.5rem;
      background: white;
      border-radius: 12px;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    label {
      display: block;
      margin-top: 1rem;
      font-weight: bold;
    }
    input, select {
      width: 100%;
      padding: 0.8rem;
      margin-top: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 1rem;
      background-color: #A7E6D7;
      color: #2E4E34;
      border: none;
      border-radius: 10px;
      margin-top: 2rem;
      cursor: pointer;
      font-size: 1rem;
    }
    .btn:hover {
      background-color: #3E7C50;
      color: white;
    }
  </style>
</head>
<body>
  <header>
    <h1>Checkout - Delivery</h1>
  </header>

  <div class="container">
    <h2>Delivery Information</h2>
    <form>
      <label for="fullName">Full Name</label>
      <input type="text" id="fullName" placeholder="John Doe" required>

      <label for="address">Address</label>
      <input type="text" id="address" placeholder="123 Main Street" required>

      <label for="city">City</label>
      <input type="text" id="city" placeholder="Bangkok" required>

      <label for="postal">Postal Code</label>
      <input type="text" id="postal" placeholder="10110" required>

      <label for="phone">Phone Number</label>
      <input type="text" id="phone" placeholder="+66 912345678" required>

      <label for="deliveryOption">Delivery Option</label>
      <select id="deliveryOption">
        <option>Standard (3-5 days)</option>
        <option>Express (1-2 days)</option>
        <option>Same Day Delivery</option>
      </select>

      <button type="submit" class="btn">Proceed to Payment</button>
    </form>
  </div>

  <footer>
    <p>&copy; 2025 CoCoGold </p>
  </footer>
</body>
</html>
